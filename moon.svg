<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <radialGradient id="moonFill" cx="40%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#e6e0d6"/>
      <stop offset="60%" stop-color="#bdb5a8"/>
      <stop offset="100%" stop-color="#8b8378"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8b8a2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8b8a2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="moonClip">
      <circle cx="700" cy="130" r="72"/>
    </clipPath>
  </defs>

  <style>
    .star { fill: #d8d2c8; animation: twinkle 4s ease-in-out infinite; }
    .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
    .s5 { animation-delay: 2.8s; } .s6 { animation-delay: 3.5s; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

    .shadow { animation: phase 10s ease-in-out infinite; }
    @keyframes phase {
      0%   { transform: translateX(-150px); }
      50%  { transform: translateX(0px); }
      100% { transform: translateX(150px); }
    }

    .glow { animation: breathe 6s ease-in-out infinite; transform-origin: 700px 130px; }
    @keyframes breathe { 0%,100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }

    .title { fill: #d8d2c8; font: 600 38px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px;
             animation: rise 1.4s ease-out .2s both; }
    .sub   { fill: #8b7765; font: 400 16px 'SFMono-Regular', Consolas, Menlo, monospace; letter-spacing: 2px;
             animation: rise 1.4s ease-out .8s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect width="900" height="260" rx="14" fill="#0d0b0a"/>

  <circle class="star"    cx="60"  cy="40"  r="1.4"/>
  <circle class="star s2" cx="190" cy="215" r="1.1"/>
  <circle class="star s3" cx="330" cy="30"  r="1.6"/>
  <circle class="star s4" cx="470" cy="200" r="1.2"/>
  <circle class="star s5" cx="560" cy="45"  r="1.3"/>
  <circle class="star s6" cx="850" cy="60"  r="1.5"/>
  <circle class="star s3" cx="820" cy="220" r="1.1"/>
  <circle class="star s5" cx="120" cy="150" r="1"/>
  <circle class="star s2" cx="610" cy="235" r="1.2"/>

  <circle class="glow" cx="700" cy="130" r="120" fill="url(#glow)"/>

  <circle cx="700" cy="130" r="72" fill="url(#moonFill)"/>
  <g clip-path="url(#moonClip)" fill="#8b8378" opacity=".35">
    <circle cx="672" cy="108" r="12"/>
    <circle cx="726" cy="150" r="16"/>
    <circle cx="690" cy="168" r="7"/>
    <circle cx="735" cy="102" r="6"/>
  </g>
  <g clip-path="url(#moonClip)">
    <circle class="shadow" cx="700" cy="130" r="74" fill="#0d0b0a" opacity=".93" transform="translate(-45 0)"/>
  </g>

  <text class="title" x="60" y="122" font-size="38" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">volodymyr pieknyi</text>
  <text class="sub"   x="62" y="158" font-size="16" font-family="SFMono-Regular, Consolas, Menlo, monospace">full-stack engineer · lviv</text>
</svg>
